<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9dde0"/>
      <stop offset="0.45" stop-color="#f7f8f9"/>
      <stop offset="0.6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e7ea"/>
    </linearGradient>
    <linearGradient id="left_glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2326"/>
      <stop offset="0.55" stop-color="#4a5257"/>
      <stop offset="1" stop-color="#9aa3a8"/>
    </linearGradient>
    <linearGradient id="right_glass" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15191b"/>
      <stop offset="0.5" stop-color="#3a4246"/>
      <stop offset="1" stop-color="#b8bfc3"/>
    </linearGradient>
    <pattern id="left_windows" width="54" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-28) skewX(-12)">
      <rect width="54" height="40" fill="none"/>
      <rect x="4" y="4" width="46" height="32" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="4" y="4" width="46" height="12" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <pattern id="right_windows" width="62" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(24) skewX(10)">
      <rect width="62" height="34" fill="none"/>
      <rect x="5" y="4" width="52" height="26" fill="#ffffff" fill-opacity="0.78"/>
      <rect x="5" y="4" width="52" height="8" fill="#ffffff" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="1600" height="220" fill="url(#sky)"/>

  <!-- Left tower, seen from below and converging toward the center. -->
  <polygon points="0,0 470,0 330,220 0,220" fill="url(#left_glass)"/>
  <polygon points="0,0 470,0 330,220 0,220" fill="url(#left_windows)"/>
  <polygon points="300,0 470,0 330,220 250,220" fill="#ffffff" fill-opacity="0.12"/>

  <!-- Right tower, a lighter facade catching the sky. -->
  <polygon points="930,0 1600,0 1600,220 1210,220" fill="url(#right_glass)"/>
  <polygon points="930,0 1600,0 1600,220 1210,220" fill="url(#right_windows)"/>
  <polygon points="930,0 1010,0 1260,220 1210,220" fill="#0e1214" fill-opacity="0.55"/>
</svg>
