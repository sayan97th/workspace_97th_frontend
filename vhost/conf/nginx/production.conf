# =============================================================================
# Nginx Virtual Host — Workspace 97th Frontend (Production)
# Domain  : workspace97th.97dev.com
# Upstream: Next.js (PM2) on 127.0.0.1:3800
# Server  : Ubuntu / Debian
# =============================================================================

server {
    listen 80;
    server_name workspace97th.97dev.com;

    access_log /var/log/nginx/workspace97th.97dev.com.access.log;
    error_log  /var/log/nginx/workspace97th.97dev.com.error.log;

    client_max_body_size 50M;

    # Reverse proxy to the Next.js process managed by PM2.
    location / {
        proxy_pass         http://127.0.0.1:3800;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Cache Next.js build assets aggressively.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3800;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
